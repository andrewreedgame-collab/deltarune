<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Cold Game Launcher</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .launcher-summary {
      margin: 24px 0;
      font-size: 20px;
      line-height: 1.6;
    }
    .launcher-grid {
      display: grid;
      gap: 16px;
      margin-top: 24px;
    }
    .launcher-link {
      display: block;
      padding: 18px 20px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(0,0,0,0.5);
      color: white;
      text-decoration: none;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .launcher-link:hover {
      background: rgba(255,255,255,0.1);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <img src="logo.png" alt="Logo" class="logo">
  </div>

  <div class="menu">
    <div class="row">
      <span class="chapter">Cold Game</span>
      <span class="title">Unified Chapter Launcher</span>
      <img src="icons/0.png" alt="Launcher">
    </div>

    <div class="launcher-summary">
      <p>This page launches chapters 1–5 directly, without emulator tool overlays. Use it for a clean chapter selection experience.</p>
    </div>

    <div class="launcher-grid">
      <a class="launcher-link" href="chapter1/index.html">Chapter 1</a>
      <a class="launcher-link" href="chapter2/index.html">Chapter 2</a>
      <a class="launcher-link" href="chapter3/index.html">Chapter 3</a>
      <a class="launcher-link" href="chapter4/index.html">Chapter 4</a>
      <a class="launcher-link" href="chapter5/index.html">Chapter 5</a>
      <a class="launcher-link" href="index.html">Back to Main Menu</a>
    </div>
  </div>
</body>
</html>
